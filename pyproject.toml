[project]
dependencies = [
    "appwindows>= 1.3.0",
    "keyboard >= 0.13.2",
    "mouse >= 0.7.1",
    "numpy >= 1.20",
    "pillow >= 11.0",
    "easyocr >= 1.7.2",
    "thefuzz >= 0.20.0",
    "ultralytics >= 8.4.30",
    "screeninfo >= 0.8"
]
name = "apparser"
version = "1.0.0"
authors = [
    { name = "Terochkin A.S", email = "apparser.development@gmail.com" },
]
description = "The apparser library is designed for managing computer programs."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)"
]

[project.urls]
Repository = "https://github.com/lexter0705/apparser"
Issues = "https://github.com/lexter0705/apparser/issues"
