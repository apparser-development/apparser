[project]
dependencies = [
    "appwindows >= 1.3.0",
    "keyboard >= 0.13.2",
    "mouse >= 0.7.1",
    "numpy >= 1.20",
    "pillow >= 11.0",
    "screeninfo >= 0.8",
    "thefuzz >= 0.20.0"
]
name = "apparser"
version = "1.0.0"
authors = [
    { name = "Terochkin A.S", email = "apparser.development@gmail.com" },
]
description = "The apparser library is designed for managing computer programs."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)"
]

[project.urls]
Repository = "https://github.com/lexter0705/apparser"
Issues = "https://github.com/lexter0705/apparser/issues"

[project.optional-dependencies]
cv = [
    "ultralytics >= 8.4.30"
]

ocr = [
    "easyocr >= 1.7.2",
    "paddleocr"
]

speak = [
    "ChatTTS",
    "sounddevice",
    "torch"
]

all = [
  "apparser[cv]",
  "apparser[ocr]",
  "apparser[speak]",
]
