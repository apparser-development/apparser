name: docs

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip sphinx sphinxawesome-theme .
      - run: python docs/generate_api.py
      - run: python -m sphinx -b html docs docs/_build/html
      - run: New-Item docs/_build/html/.nojekyll -ItemType File -Force
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: docs/_build/html
          force_orphan: true
